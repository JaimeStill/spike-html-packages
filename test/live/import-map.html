<!doctype html>
<!-- The import-map page: the foundation at v0.1.0 and the components at v0.2.0, unbundled from
     jsDelivr's /gh/ by a hand-written import map, and lit from its /npm/ build, at the components'
     pin, which mise run check holds it to. It renders the three components and sets
     window.report, a promise of what each shadow root adopted, or of the error that stopped it.
     It links the foundation's page.css from jsDelivr at the foundation's tag, which mise run check
     also holds it to. scripts/live.js serves it from the loopback address. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>import-map page</title>
    <!-- Lit is one entry: jsDelivr's +esm names its own dependencies by paths on its origin. The
         components import the foundation by its package name, which the foundation's prefix
         maps; the SDK isn't on the page, so it has no entry. -->
    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/+esm",
          "@jaimestill/spike-html-packages-foundation/": "https://cdn.jsdelivr.net/gh/JaimeStill/spike-html-packages-foundation@v0.1.0/dist/",
          "@jaimestill/spike-html-packages-components/": "https://cdn.jsdelivr.net/gh/JaimeStill/spike-html-packages-components@v0.2.0/dist/"
        }
      }
    </script>
    <!-- The foundation's page entry: its layer order, then its relative imports, which resolve
         beside it on jsDelivr. Fetched with CORS, which jsDelivr allows, so the page can read its
         rules, as the check of its layer order does. -->
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/JaimeStill/spike-html-packages-foundation@v0.1.0/dist/page.css"
    />
  </head>
  <body>
    <main>
      <sl-status-badge label="draft"></sl-status-badge>
      <sl-entry-lit-shadow></sl-entry-lit-shadow>
      <sl-pagination-lit-shadow page="1" size="12" total="30"></sl-pagination-lit-shadow>
    </main>
    <script type="module">
      window.report = (async () => {
        try {
          // The page imports the foundation's two baseline sheets by the same names the
          // components do: the module map holds one sheet per URL, so a root that adopted the
          // foundation's reset and elements adopted these objects.
          const [{ default: reset }, { default: elements }] = await Promise.all([
            import("@jaimestill/spike-html-packages-foundation/baseline/reset.css", {
              with: { type: "css" },
            }),
            import("@jaimestill/spike-html-packages-foundation/baseline/elements.css", {
              with: { type: "css" },
            }),
            import("@jaimestill/spike-html-packages-components/status-badge.js"),
            import("@jaimestill/spike-html-packages-components/entry-lit-shadow.js"),
            import("@jaimestill/spike-html-packages-components/pagination-lit-shadow.js"),
          ]);
          document.querySelector("sl-entry-lit-shadow").item = {
            id: "1",
            name: "notes",
            status: "ready",
            updated_at: "2026-10-19T00:00:00Z",
          };
          const roots = [];
          for (const tag of ["sl-status-badge", "sl-entry-lit-shadow", "sl-pagination-lit-shadow"]) {
            const element = document.querySelector(tag);
            await element.updateComplete;
            const sheets = element.shadowRoot?.adoptedStyleSheets ?? [];
            roots.push({
              tag,
              elements: element.shadowRoot?.childElementCount ?? 0,
              sheets: sheets.length,
              reset: sheets[0] === reset,
              baseline: sheets[1] === elements,
            });
          }
          return { roots };
        } catch (error) {
          return { error: error.message };
        }
      })();
    </script>
  </body>
</html>
