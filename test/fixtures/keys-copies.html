<!doctype html>
<!-- adapted from spike-html-design v0.7.0: test/fixtures/keys-copies.html, on this repository's keys
     module, layers/foundation/keys.ts (served as keys.js). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>keys copies fixture</title>
  </head>
  <body>
    <h1>keys copies fixture</h1>
    <p>Two copies of the keys module, loaded from two URLs, share one store and one listener: T clicks the button once, and each copy's register() binding fires once.</p>
    <button type="button" data-keys="t">Theme <kbd>T</kbd></button>
    <script type="module">
      import * as a from "../../layers/foundation/keys.js?a";
      import * as b from "../../layers/foundation/keys.js?b";

      window.log = [];
      document.querySelector("button").addEventListener("click", () => window.log.push("t"));
      a.register("a", "from a", () => window.log.push("a"));
      b.register("b", "from b", () => window.log.push("b"));
      window.copies = a.register !== b.register;
    </script>
  </body>
</html>
