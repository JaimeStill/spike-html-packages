<!doctype html>
<!-- The components cases' page: the query's module, when it names one, probe.js or restyle.js in
     test/browser/support/, runs and writes its verdict into #verdict. window.verdict settles once
     the run ends, a module that failed to load included. Lit's bare specifiers map onto /deps/,
     where the server answers with the installed packages. Adapted from spike-html-conventions
     (a88828a): scripts/browser-cases.js's page(). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>components cases</title>
    <link rel="stylesheet" href="../../packages/spike-html-packages/dist/foundation/page.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/"
        }
      }
    </script>
  </head>
  <body>
    <main></main>
    <pre id="verdict">FAIL: the cases didn't run</pre>
    <pre id="report"></pre>
    <script>
      let settle;
      window.verdict = new Promise((resolve) => (settle = resolve));
    </script>
    <script type="module">
      const module = new URLSearchParams(location.search).get("module");
      try {
        if (module !== null) {
          if (!["probe", "restyle"].includes(module)) throw new Error(`no module ${module}`);
          const { run } = await import(`../browser/support/${module}.js`);
          await run();
        }
      } catch (error) {
        document.getElementById("verdict").textContent = `FAIL: ${error.message}`;
      } finally {
        settle();
      }
    </script>
  </body>
</html>
