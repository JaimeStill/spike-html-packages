<!doctype html>
<!-- adapted from spike-html-conventions a88828a: scripts/browser-cases.js's page(), the page its
     probe and restyle check ran on, written here as a file the server serves, on this repository's
     page entry, with the import map its unbundled server wrote.

     The components' cases, one module per load: the query's module, demo/probe.ts, demo/restyle.ts,
     or demo/contract.ts (served as .js, their types stripped), runs with the query's version, and
     writes its verdict into #verdict and its report into #report. The classic script makes
     window.verdict, a promise settled once the run returns or throws, a module that failed to load
     among the throws, which then writes the verdict; the browser tier awaits the verdict itself,
     never the page's load, which the run's top-level await doesn't hold.

     Lit's bare specifiers map onto the installed packages, which the server serves under /deps/
     (scripts/browser-cases.js), so the components load unbundled, as conventions' unbundled
     server loaded them. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>components cases</title>
    <link rel="stylesheet" href="../../layers/foundation/page.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/"
        }
      }
    </script>
  </head>
  <body>
    <main></main>
    <pre id="verdict">FAIL: the cases didn't run</pre>
    <pre id="report"></pre>
    <script>
      let settle;
      window.verdict = new Promise((resolve) => (settle = resolve));
    </script>
    <script type="module">
      const query = new URLSearchParams(location.search);
      const module = query.get("module");
      try {
        if (!["probe", "restyle", "contract"].includes(module)) {
          throw new Error(`no module ${module}`);
        }
        const { run } = await import(`../../demo/${module}.js`);
        await run(query.get("version"));
      } catch (error) {
        document.getElementById("verdict").textContent = `FAIL: ${error.message}`;
      } finally {
        settle();
      }
    </script>
  </body>
</html>
