# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
[settings]
task.run_auto_install = false

# spike-html-conventions' settled toolchain, at its pins.
[tools]
# A consumer only: the fixtures install the releases under npm, pnpm, and bun.
bun = "1.4.3"
node = "26.12.0"
# npm 12, its own pin: node 26.12.0 bundles npm 11.20.0, from before npm 12 refused git
# dependencies by default.
npm = "12.2.1"
pnpm = "12.14.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
"npm:vite" = "8.3.4"

# The browser tier's browser: Chrome for Testing's chrome-headless-shell, one generic linux64 zip.
# Chrome for Testing publishes no checksums, so the sha256 and size are ours, taken from the
# download by hand at each bump; mise refuses a download that doesn't match. Its latest is the
# Stable channel of Chrome for Testing's last-known-good versions.
[tools."http:chrome-headless-shell"]
version = "155.0.8059.84"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:a5d71b91aa996fef00517cd212b2dfb816b43055edefbe727e6fd562d4ae1f9c", size = "125033980" }

[tasks.check]
description = "Build the release into dist/ (scripts/build.sh), lint (ESLint, with the layer direction and the CSS module script rule), format-check (Prettier), type-check (tsc, typescript-go), and shellcheck the sources, and test them: the unit tier (the keys grammar, the registry, the layer direction, the SDK's declarations, and the release build's integrity against layers/, files, and exports, under node --test) and the browser tier (the foundation's tool classes against spike-html-design v0.7.0's computed styles, the keys runtime and its help dialog on v0.7.0's fixtures, and the components' contract cases, on pages served from the working tree, the .ts modules' types stripped and lit mapped onto the installed packages, through the raw Chromium debugging pipe on the pinned chrome-headless-shell, under node --test), and install the packed release offline into the consumer fixtures under pnpm, npm, and bun, checking each install's files and every export; reads no network, writes only dist/. The layers task grows it to spike-html-conventions' check"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
# The lint tooling, ESLint and Prettier with their plugins, and lit, the one runtime dependency,
# come from node_modules, installed once outside the check (mise run install), so the check itself
# never reads the network.
if [ ! -x node_modules/.bin/eslint ] || [ ! -x node_modules/.bin/prettier ]; then
  echo "check: the lint tooling (devDependencies) isn't installed; run mise run install first" >&2
  exit 1
fi
if [ ! -f node_modules/lit/package.json ]; then
  echo "check: lit (dependencies) isn't installed; run mise run install first" >&2
  exit 1
fi
# The browser tier's browser, the chrome-headless-shell pin in [tools] above, by its path. mise
# which fails when the pin isn't installed, so that is named here, with the fix, rather than left
# to mise's message.
if ! headless_shell=$(mise which chrome-headless-shell 2>/dev/null); then
  echo "check: chrome-headless-shell (mise.toml's pin) isn't installed; run mise run install first" >&2
  exit 1
fi
# The shell must report the version pinned, read from mise itself. mise's download cache is keyed
# by checksum, so a version bumped without its new sha256 installs the cached old build under the
# new version's name; this fails it.
shell_pin=$(mise ls --local --json http:chrome-headless-shell \
  | node -e 'console.log(JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0]?.requested_version ?? "")')
shell_version=$("$headless_shell" --version)
case "$shell_version" in
  *" $shell_pin") ;;
  *)
    echo "check: $headless_shell reports $shell_version, but mise.toml pins chrome-headless-shell $shell_pin; give the pin its own sha256 and size" >&2
    exit 1
    ;;
esac
# The release build first, into dist/ (gitignored), so the unit tier's integrity test
# (test/release.test.js) and the consumer installs below read a fresh emit.
scripts/build.sh
# The project's own copies, by pnpm exec: eslint.config.js holds the lint rules and the layer
# table, .prettierrc.json the format, and .prettierignore limits Prettier to the code, the JSON,
# and the CSS.
pnpm exec eslint .
pnpm exec prettier --check .
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -not -path './.cache/*' \
  -not -path './dist/*' -print0 \
  | xargs -0 -r shellcheck
# Type-check the layers and the demo's modules (tsconfig.json) with the mise-pinned typescript-go,
# whose binary is tsc; the tests and scripts are plain JavaScript outside it.
tsc --noEmit -p .
# The unit tier: test/*.test.js, the DOM-free modules as node runs them, their types stripped, the
# layer direction, and the SDK's declarations under the pinned tsc.
node --test test/
# The browser tier, under node --test: scripts/browser.test.js, scripts/browser-keys.test.js, and
# scripts/browser-components.test.js, outside test/ so the unit tier never runs them, through the
# raw pipe (scripts/browser-pipe.js, no package) on the pinned chrome-headless-shell, the pages
# served from the working tree on the loopback address, the .ts modules' types stripped as they
# are served and lit answered from its install under /deps/; the driver fails naming the fix when
# the executable it is given is missing.
BROWSER_DRIVER=pipe BROWSER_EXECUTABLE="$headless_shell" \
  node --test scripts/browser.test.js scripts/browser-keys.test.js scripts/browser-components.test.js
# The release, packed from dist/ with pnpm pack, installed offline into each consumer fixture under
# pnpm, npm, and bun, with lit from the caches under .cache/consumers/ (mise run install warms
# them): each install's files are the whole pack, every export resolves under node or bun, and
# tsc type-checks the fixture against the installed declarations.
scripts/consumers.sh
'''

[tasks.install]
description = "Install every mise.toml pin (mise install: the check's browser, chrome-headless-shell, with the rest; each skipped when it's already installed), lit (the one dependency), and the lint tooling (the devDependencies: ESLint, Prettier, and their plugins) from the lockfile with pnpm, and warm the pnpm store, npm cache, and bun cache under .cache/consumers/ with lit for the check's offline consumer installs; reads the network"
run = [
  "mise install",
  "pnpm install --frozen-lockfile",
  "scripts/consumers.sh warm",
]
dir = "{{config_root}}"

[tasks.build]
description = "Build the release into dist/ (gitignored): every .ts module under layers/ as an unbundled, unminified ES module .js with its .d.ts by tsc emit (tsconfig.build.json), and every .d.ts and .css source copied beside them at its own relative path; reads no network"
run = "scripts/build.sh"
dir = "{{config_root}}"

[tasks.installs]
description = "Build the release, pack it with pnpm pack, install it offline into the consumer fixtures under pnpm, npm, and bun as the check does, and print each install's file list; reads no network"
depends = ["build"]
run = "scripts/consumers.sh list"
dir = "{{config_root}}"

[tasks.demo]
description = "Serve the demo pages from the working tree on the loopback address, printing their URLs and running until Ctrl-C: demo/tools.html, every tool class of the foundation's sheets on the default profiles (it also opens from file://), demo/keys.html, the keys family's bindings and help dialog, and demo/components.html, the shadow-root pagination, entry, and status badge on the foundation; reads no network, writes nothing"
run = "node scripts/demo.js"
dir = "{{config_root}}"

[tasks.measure]
description = "Record the import extension's rows (evidence 5), outside the check: the layers built by tsc in the .js form (the sources as they are) and the .ts form (a scratch copy, every relative .js specifier rewritten to .ts, emitted with rewriteRelativeImportExtensions), each form's emit type-checked as a consumer reads it, loaded unbundled in the pinned chrome-headless-shell through the raw pipe, and built through Vite without and with the local CSS plugin (scripts/css-sheets.js) and loaded; and each form's sources loaded with no build, from the check's server and one that answers .ts, by node's type stripping, and under Vite's dev server; one dated markdown report on stdout; reads no network, writes nothing to the working tree"
run = "scripts/measure.sh"
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool and package.json dependency and devDependency pinned behind its latest (typescript against typescript-eslint's peer range), one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
