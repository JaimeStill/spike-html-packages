# Tasks never install a missing tool; mise run install, lock, currency, and live are the tasks that
# read the network.
[settings]
task.run_auto_install = false

# spike-html-conventions' settled toolchain, at its pins: node runs Prettier, which pnpm installs.
[tools]
# A consumer only: the fixtures install the releases under npm, pnpm, and bun.
bun = "1.4.4"
node = "26.12.1"
# Its own pin: node 26.12.1 bundles npm 11.20.0, and the fixtures hold npm 12's git guard.
npm = "12.2.1"
pnpm = "12.15.0"
shellcheck = "0.11.0"

# The browser the consumer pages and the live task load, at spike-html-packages-components'
# (8cb64a8) pin. Chrome for Testing
# publishes no checksums: take the sha256 and size from the download by hand at each bump.
[tools."http:chrome-headless-shell"]
version = "156.0.8078.47"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:0d5acc62c3e213f8c87d3c298d66ffcf9a236d12ea4b9f85318bf85dbc279daa", size = "125799226" }

# Adapted from spike-html-packages-components (8cb64a8): mise.toml's preflight, its description
# naming the caches, the tag fetches, and the live task's browser.
[tasks.preflight]
description = "Fail naming mise run install when a tool, cache, or tag fetch the tasks need is missing; with live, the browser alone"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: Prettier and shellcheck"
depends = ["lint:format", "lint:shell"]

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
depends = ["preflight"]
run = "shellcheck scripts/*.sh"

[tasks."test:consumers"]
description = "Install each consumer fixture offline from its lockfile under npm, pnpm, and bun, check the install against the layers' tags, load its page in the browser, and check the jsDelivr page's pins"
depends = ["preflight"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) scripts/consumers.sh"

[tasks.check]
description = "Run every check; reads no network; writes nothing in the repository outside .cache/"
depends = ["lint", "test:consumers"]

[tasks.install]
description = "Install the pins, the browser among them, and node_modules, fill the consumer caches, and fetch the layers' tags; reads the network"
run = "scripts/install.sh"

[tasks.lock]
description = "Resolve each consumer fixture anew under its manager and guard, and rewrite its lockfile; reads the network"
run = "scripts/lock.sh"

[tasks.currency]
description = "Report every pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true

[tasks.live]
description = "Print a dated table of the releases' facts on GitHub and jsDelivr, the import-map page among them, and of npm, pnpm, and bun installing them from the network and from GitHub Packages, with the token in GITHUB_PACKAGES_TOKEN; reads the network, writes nothing in the repository"
depends = ["preflight live"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node scripts/live.js"

[tasks.publish]
description = "Publish each layer's v0.1.0 tree to GitHub Packages at 0.0.1, skipping the layers it already holds, with the token in GITHUB_PACKAGES_TOKEN; dry-run uploads nothing; reads the network, writes nothing in the repository"
run = "scripts/publish.sh"
