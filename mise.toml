# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# spike-html-conventions' settled toolchain, at its pins: node runs Prettier, which pnpm installs.
[tools]
node = "26.12.1"
pnpm = "12.15.0"

[tasks.install]
description = "Install the pins and node_modules from the lockfile; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

# The layers' packages live in spike-html-packages-foundation and spike-html-packages-sdk now;
# what is left here is the spike's record, and its check is the format alone.
[tasks.check]
description = "Check the format with Prettier; reads no network and writes nothing"
run = """
[ -x node_modules/.bin/prettier ] || { echo "check: prettier isn't installed; run mise run install" >&2; exit 1; }
pnpm exec prettier --check .
"""

[tasks.currency]
description = "Report every pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
