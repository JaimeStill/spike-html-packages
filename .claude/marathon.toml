# Project kind: this repository holds the spike's record and docs, checked by `mise run check`
# (Prettier alone); the layers live in spike-html-packages-foundation and spike-html-packages-sdk.
# Its goals live in the coordinator's roadmap (standards-lab/context/roadmap.toml).
# `mise run currency` reports every mise tool and package.json pin behind its latest. No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. Pull requests run
# no checks, so the merge doesn't wait on them.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
