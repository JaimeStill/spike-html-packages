# Project kind: this repository holds the spike's record, docs, and consumer check, checked by
# `mise run check` (Prettier, shellcheck, and the consumer fixtures installed offline by tag); the
# layers live in spike-html-packages-foundation, spike-html-packages-sdk, and
# spike-html-packages-components.
# Its goals live in the coordinator's roadmap (standards-lab/context/roadmap.toml).
# `mise run currency` reports every mise tool, package.json pin, and fixture tag behind its latest.
# `mise run publish`, by hand with GITHUB_PACKAGES_TOKEN, publishes the layers to GitHub Packages
# at 0.0.1; `mise run live` needs the same token.
# No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. Pull requests run
# no checks, so the merge doesn't wait on them.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
